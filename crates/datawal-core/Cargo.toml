[package]
name = "datawal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Core record store for datawal: append-only framed records (CRC32C), valid-prefix recovery, bytes-based KV projection with tombstones, manual compaction, and JSONL export. v0.1-pre."

[dependencies]
anyhow = { workspace = true }
crc32c = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
safeatomic-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "record_log"
harness = false

[[bench]]
name = "datawal_kv"
harness = false

[[bench]]
name = "compaction"
harness = false

[[bench]]
name = "recovery"
harness = false
