[package]
name = "datawal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Read-only command-line inspector for datawal stores (scan, get, report, verify, dump)."
keywords = ["datawal", "cli", "log", "inspect", "wal"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
# Not publishable until `datawal 0.1.4` is released to crates.io with
# `scan_iter` (PR #23). The release PR re-enables publishing for this
# crate and updates the dependency version. See `dev/0.1.4-plan.md`.
publish = false

[[bin]]
name = "datawal"
path = "src/main.rs"
# The binary and the `datawal` library both produce a `datawal`
# rustdoc output dir; disable doc for the binary to avoid a cargo
# warning about a filename collision (cargo issue #6313).
doc = false

[dependencies]
datawal = { path = "../datawal-core", version = "0.1.0-alpha.1" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
clap = { version = "=4.5.20", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
