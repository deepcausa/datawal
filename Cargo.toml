[workspace]
resolver = "2"
members = [
    "crates/datawal-core",
]

[workspace.package]
version = "0.1.0-pre"
edition = "2021"
license = "Apache-2.0"
repository = ""
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
safeatomic-rs = { path = "../safeatomic-rs" }
tempfile = "3"
